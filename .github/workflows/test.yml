# The full suite, on every push to main (macOS and Ubuntu) and every pull request into it that is
# not a draft (Ubuntu): `go test -short` is for working locally; this is what enforces everything
# else (docs/panel.md, Testing). Actions are pinned to commit SHAs; no secrets.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review: every row opens its PR as a draft (OPS-108), and a draft runs nothing (the
    # job's `if:`), so marking it ready is what starts its suite (OPS-98).
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A newer push to a pull request supersedes its running suite. A push to main never cancels:
# each merge commit keeps its own result.
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # A push to a draft spends no minutes. Its skipped run reports a `test` check as skipping,
    # which the merge guard's GATE_PR_CHECKS (.claude/project.conf) never counts as a pass.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run Ubuntu only (OPS-26, temporary; OPS-28 restores macOS): the local
        # gate's short suite and scoped race run on the owner's Mac for the head it merges, and
        # Linux is the leg only CI covers. main runs both, so a macOS-only break still surfaces
        # on the merge that caused it (.claude/health/push-main.sh reports it at session start).
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["macos-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    # internal/plugin reached 1500 s under -race on a macOS runner (go test's limit below), and the
    # macOS job 2423 s against this one, before go test's step stopped running merge-guard there
    # (OPS-240). The roadmap's o.12 checks the margin; OPS-244, queued, is its health line.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: framework
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Every branch, origin/main among them: change-approval.sh reads the delegation key and the
        # guarded lists from origin/main, and fails a delegated approval where it cannot (OPS-127).
        with:
          fetch-depth: 0
      # change-approval.sh takes main from origin's HEAD, which actions/checkout does not set.
      - run: git remote set-head origin "$DEFAULT_BRANCH"
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: framework/go.mod
          cache-dependency-path: framework/go.sum
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi
          tmux -V
      # The template's OpenSpec check validates its example change through the module's symlinks
      # (template/.claude/checks/openspec.sh); OPENSPEC_REQUIRED makes a missing CLI a failure
      # here, where it is installed. Pinned: the version the module was tested against.
      - name: Install the OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.13.2 && openspec --version
        env:
          DO_NOT_TRACK: "1"
          OPENSPEC_TELEMETRY: "0"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # -count=1: internal/plugin and internal/template run the template's checks in a
      # subprocess, so Go's test cache (restored by setup-go) cannot see a template/ or plugin/
      # change and would report a stale pass. -timeout: the per-package default of 10 minutes
      # is too tight for internal/plugin on macOS runners (OPS-19).
      - run: go test -race -count=1 -timeout 25m ./...
        env:
          # Hosted runners are slower than a laptop: every test deadline doubles
          # (internal/testwait). A passing test never waits for one.
          STRIDAL_TEST_SLOW: "2"
          OPENSPEC_REQUIRED: "1"
          NODE_REQUIRED: "1"
          # merge-guard is the set's largest check. On macOS it runs once, in the process-checks
          # step below, not also in internal/template's and internal/plugin's whole sets, which
          # are this step's time. Ubuntu, the leg a merge waits for, runs all three, as does the
          # full local gate (OPS-240; check-sets.sh, part 6, holds this form). The loss: a red
          # go test here skips that step, so that commit has no merge-guard run on macOS at all.
          CHECKS_SKIP: ${{ runner.os == 'macOS' && 'merge-guard' || '' }}
      # This repo runs the operating model it ships (OPS-8): its own process checks, over its own
      # records, hooks and roles, the no-stridal check included (no stridal is installed here).
      - name: process checks (this repo's operating model)
        working-directory: .
        run: sh .claude/checks/run.sh
        env:
          OPENSPEC_REQUIRED: "1"
          NODE_REQUIRED: "1"
